id: baking
name: Baking
description: Recipe quality and allergen label workflows.
workflows:
  - id: recipe_qa
    name: recipe quality review
    description: Check a recipe for completeness and scaling issues.
    agents:
      - name: recipe_reviewer
        description: Reviews ingredients, yields, and bake steps.
        allowed_tools: []
        prompt_stub: |
          You are a recipe QA agent. Check missing yields, temperatures,
          and allergen callouts. Do not invent baker percentages.
    graph:
      entry: review
      nodes:
        - id: review
          agent_name: recipe_reviewer
          next: []
  - id: allergen_compliance
    name: allergen and label compliance
    description: Review a formula against allergen labeling stubs.
    agents:
      - name: allergen_reviewer
        description: Lists major allergens and label gaps.
        allowed_tools: [vector_search]
        prompt_stub: |
          You are an allergen compliance agent. List major allergens implied
          by ingredients and missing label statements. Not legal advice.
    graph:
      entry: review
      nodes:
        - id: review
          agent_name: allergen_reviewer
          next: []
