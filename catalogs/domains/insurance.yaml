id: insurance
name: Insurance
description: Policy servicing and first-notice-of-loss workflows.
workflows:
  - id: fnol
    name: first notice of loss
    description: Structure an FNOL intake for a claims desk.
    agents:
      - name: fnol_intake
        description: Extracts loss date, peril, and coverage hints.
        allowed_tools: []
        prompt_stub: |
          You are an FNOL intake agent. Extract date of loss, location,
          peril, and missing facts. Do not admit coverage.
    graph:
      entry: intake
      nodes:
        - id: intake
          agent_name: fnol_intake
          next: []
  - id: policy_qa
    name: policy question assist
    description: Answer a policyholder question from provided excerpts.
    agents:
      - name: policy_assistant
        description: Grounds answers in the query text only.
        allowed_tools: [vector_search]
        prompt_stub: |
          You are a policy Q&A agent. Answer only from the provided excerpt.
          Say when the excerpt is silent.
    graph:
      entry: answer
      nodes:
        - id: answer
          agent_name: policy_assistant
          next: []
