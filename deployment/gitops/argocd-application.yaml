apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-agent-factory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/multi-agent-factory.git
    targetRevision: main
    path: deployment/helm
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: multi-agent-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
