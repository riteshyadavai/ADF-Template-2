[project]
name = "multi-agent-factory"
version = "0.2.12"
description = "Production-ready reusable multi-agent project factory with shared infrastructure, security, and observability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "google-adk>=2.0.0",
    "mcp>=1.24,<2",
    "litellm>=1.83.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "prometheus-client>=0.21.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "tenacity>=9.0.0",
    "semver>=3.0.0",
    "langgraph>=0.2.0",
    "a2a-sdk[http-server]>=1.1.2",
    "typer>=0.16.0",
    "rich>=13.9.0",
    "questionary>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]
eval = [
    "deepeval>=1.5.0",
    "ragas>=0.2.0",
]
observability = [
    "logfire>=3.0.0",
    "langfuse>=3.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]

[project.scripts]
66degrees-factory = "cli.main:app"
factory = "cli.main:app"

[project.optional-dependencies]
aws = [
    "boto3>=1.43.80",
]
documents = [
    "docling>=2.122.0",
]
opensearch = [
    "opensearch-py[async]>=3.2.0",
]
qdrant = [
    "qdrant-client>=1.14.0",
]
cache-memcached = [
    "pymemcache>=4.0.0",
]
looker = [
    "looker-sdk>=24.0.0",
]
bqml = [
    "google-cloud-bigquery>=3.25.0",
]
asset-factory = [
    "enterprise-agent-sdk @ git+https://github.com/66degrees/agentic-asset-factory.git",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "evals"]
markers = [
    "integration: integration tests requiring external services",
    "contract: agent manifest and schema contract tests",
    "eval: evaluation regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "app", "cli", "config", "factories", "shared"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
strict = false
ignore_missing_imports = true
follow_imports = "skip"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["agents", "app", "shared", "factories", "config", "cli"]

[tool.hatch.build.targets.wheel.force-include]
"catalogs" = "catalogs"
"tests" = "tests"
"evals" = "evals"
"docs" = "docs"
"examples" = "examples"
"deployment" = "deployment"
"data" = "data"
"notebooks" = "notebooks"
"Makefile" = "Makefile"
"README.md" = "README.md"
".env.example" = ".env.example"
"Dockerfile" = "Dockerfile"
"LICENSE" = "LICENSE"
"pyproject.toml" = "pyproject.toml"
